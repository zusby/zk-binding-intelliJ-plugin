name: Release

# Push a tag like v1.2.0 (matching `version` in build.gradle.kts) to test, build,
# publish to JetBrains Marketplace and create a GitHub release with the plugin zip.
#
# Required repository secret: PUBLISH_TOKEN (Marketplace → My Profile → Tokens).
# Optional, for signing: CERTIFICATE_CHAIN, PRIVATE_KEY, PRIVATE_KEY_PASSWORD.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Check tag matches project version
        run: |
          VERSION=$(./gradlew properties -q --console=plain | awk '/^version:/ {print $2}')
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match project version $VERSION"
            exit 1
          fi

      - name: Test
        run: ./gradlew test --console=plain

      - name: Publish to JetBrains Marketplace
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew publishPlugin --console=plain

      - name: Extract release notes
        run: |
          # Section of CHANGELOG.md for this version, up to the next "## " heading.
          awk -v v="${GITHUB_REF_NAME#v}" '
            /^## / { if (found) exit; if (index($0, "[" v "]")) { found=1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          cat release-notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: build/distributions/*.zip
